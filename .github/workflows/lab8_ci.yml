name: Lab 8 - MLOps CI

on:
  push:
    branches: [main, master]
    paths:
      - "config.yaml"
      - "src/**"
      - "api/**"
      - "tests/**"
      - "requirements.txt"
      - "data/raw/day.csv"
      - ".github/workflows/lab8_ci.yml"
  pull_request:
  workflow_dispatch:

jobs:
  mlops-ci:
    runs-on: ubuntu-latest
    env:
      MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
      SKIP_DEPLOYMENT: "1"   # hosted runners have no Kubernetes cluster: build the bundle only
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run Bike Sharing MLOps pipeline
        run: python src/mlops_pipeline/bike_demand_pipeline.py --force

      - name: Run tests
        run: python -m pytest tests -q

      - name: Upload CI artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lab8-ci-${{ github.run_number }}
          path: |
            artifacts/**
            reports/**
            logs/**
            outputs/**
          if-no-files-found: ignore
